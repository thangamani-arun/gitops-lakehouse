# bitnami/superset chart. Verified against `helm show values bitnami/superset --version 5.0.0`
# after the first deploy attempt failed template rendering.
#
# Bitnami moved free-tier images to the "bitnamilegacy/*" Docker Hub repo in 2025; the chart's
# own defaults (docker.io/bitnami/*) 404 on pull now. Every image reference below is pinned to
# bitnamilegacy at the exact tag the chart expects (confirmed present via Docker Hub API before
# using it) -- found by an ImagePullBackOff on the first deploy attempt. The bitnami common
# chart refuses to render non-default image repos unless explicitly told they're intentional.
global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/superset
  tag: 5.0.0-debian-12-r71

replicaCount: 2

postgresql:
  enabled: false
  # The chart's "waitForDB" initContainer references postgresql.image unconditionally even when
  # the bundled subchart is disabled (a bitnami common-chart quirk) -- without this it's nil and
  # template rendering fails. Never actually used to run anything since enabled: false.
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16-debian-12

externalDatabase:
  host: superset-pg-rw.lakehouse-bi.svc
  port: 5432
  user: superset # matches infra/cnpg-clusters/superset-pg.yaml's bootstrap.initdb.owner
  database: superset
  existingSecret: superset-pg-app # CNPG-generated
  existingSecretPasswordKey: password

redis:
  enabled: true
  architecture: standalone
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 8.2.0-debian-12-r0
  # redis subchart's own os-shell/sentinel sidecars are also bitnamilegacy now
  sentinel:
    image:
      registry: docker.io
      repository: bitnamilegacy/redis-sentinel

worker:
  replicaCount: 2
  # Top-level `resources:` below only applies to the main superset (web) deployment -- worker
  # has its own resourcesPreset (default "large" = 3Gi/1.5cpu) which OOMKilled in practice.
  # Explicit override, not a preset, per the chart's own recommendation for production.
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "2", memory: 4Gi }

beat:
  enabled: true

ingress:
  enabled: true
  ingressClassName: nginx
  hostname: superset-delab.nimbus.my
  tls: true
  extraTls:
    - hosts: ["superset-delab.nimbus.my"]
      secretName: wildcard-nimbus-tls

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { cpu: "2", memory: 2Gi }

# StarRocks connects via its MySQL-compatible protocol (port 9030) once
# workloads/starrocks/external-catalog-init.yaml has registered the Iceberg catalog and GOLD
# tables are queryable -- add the DB connection from the Superset UI/API post-deploy
# (SQLAlchemy URI: starrocks://root:@starrocks-fe-http.lakehouse-compute.svc:9030/polaris_catalog).
