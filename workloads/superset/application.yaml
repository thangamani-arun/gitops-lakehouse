apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-superset
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: superset
      targetRevision: 5.0.0
      helm:
        releaseName: superset
        valueFiles:
          - $values/workloads/superset/values.yaml
    - repoURL: https://github.com/thangamani-arun/gitops-lakehouse.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: lakehouse-bi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
