# Apache Polaris has no published Helm chart yet, so this is a plain Deployment against the
# official apache/polaris image.
#
# Persistence: uses the "relational-jdbc" backend (Postgres-native, no persistence.xml/EclipseLink
# needed), configured entirely via env vars -- this replaced an earlier eclipse-link + mounted
# polaris-server.yml approach that silently never took effect: Quarkus/Polaris only auto-loads an
# external config file named application.{yml,properties} from ./config relative to its working
# dir, not an arbitrarily-named key like polaris-server.yml, so every setting in that ConfigMap
# (persistence type, realm, S3 storage) was ignored and Polaris fell back to its ephemeral
# in-memory metastore. With 2 replicas and no shared state, each pod independently bootstrapped
# its OWN root credential for the default "POLARIS" realm -- confirmed by pulling both pods' full
# boot logs (different clientId/clientSecret per pod) and by reproducing "unauthorized_client"
# specifically when a request landed (via the round-robin Service) on the replica that didn't
# mint the credential being used. relational-jdbc's persistence lives in Postgres, shared by both
# replicas, so this can't recur.
#
# Root/bootstrap credentials: generated out-of-band and stored as the `polaris-bootstrap-credentials`
# Secret (kubectl create secret, not in git) -- same pattern as `mssql-credentials`, since this is
# effectively a root password for the catalog. Keys: POLARIS_BOOTSTRAP_CREDENTIALS
# ("<realm>,<clientId>,<clientSecret>", consumed by the admin-tool bootstrap Job below) and
# CLIENT_ID/CLIENT_SECRET (consumed by Spark/Flink/StarRocks catalog client configs).
apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-bootstrap
  namespace: lakehouse-catalog
  annotations:
    # Must complete before the Deployment (wave 2) starts: relational-jdbc requires the schema
    # and initial realm to already exist ("apache/polaris-admin-tool bootstrap") -- an
    # unbootstrapped realm makes the server 401 on every request, not just auth-token ones.
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: apache/polaris-admin-tool:1.7.0
          args:
            - bootstrap
            - -r
            - nimbus-lakehouse
            - -c
            - "$(POLARIS_BOOTSTRAP_CREDENTIALS)"
          env:
            - name: POLARIS_PERSISTENCE_TYPE
              value: relational-jdbc
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://polaris-pg-rw.lakehouse-catalog.svc:5432/polaris"
            # CNPG's app secret uses lowercase `username`/`password` keys, not the
            # QUARKUS_DATASOURCE_* names Quarkus expects -- envFrom dumps keys verbatim, so this
            # needs explicit secretKeyRef mapping (envFrom alone silently produced "no password
            # provided" SCRAM auth failures).
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: polaris-pg-app, key: username }
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: polaris-pg-app, key: password }
          envFrom:
            - secretRef:
                name: polaris-bootstrap-credentials
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  namespace: lakehouse-catalog
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1 # TEMPORARY diagnostic: testing whether StarRocks/Flink's intermittent
  # NotAuthorizedException against Polaris is caused by k8s Service load-balancing across
  # replicas (no equivalent in the flat Docker/LXC networks where this worked fine) rather
  # than a genuine Polaris server bug. Revert to 2 once the test concludes either way.
  selector:
    matchLabels:
      app: polaris
  template:
    metadata:
      labels:
        app: polaris
    spec:
      # MinIO's cert is a real Sectigo-issued *.nimbus.my wildcard (not self-signed) -- connecting
      # by bare IP fails AWS SDK v2's TLS hostname check ("Certificate for <192.168.80.128>
      # doesn't match any of the subject alternative names"), and AWS SDK v2 has no config-level
      # way to disable hostname verification (removed vs. v1; confirmed via aws-sdk-java-v2#2966
      # -- it's code-level only, TRUST_ALL_CERTIFICATES on a custom client builder, which Iceberg's
      # S3FileIO doesn't expose as a property). A custom JVM truststore trusting the leaf cert was
      # tried first and did NOT fix it -- trust and hostname verification are separate checks.
      # Real fix: give the pod a hostAlias so it reaches MinIO through a name the cert actually
      # covers, and point POLARIS_STORAGE_S3_ENDPOINT at that name instead of the bare IP.
      hostAliases:
        - ip: "192.168.80.128"
          hostnames: ["minio.nimbus.my"]
      containers:
        - name: polaris
          image: apache/polaris:1.7.0
          # No custom args: the image's default CMD is /opt/jboss/container/java/run/run-java.sh
          # (a Quarkus run-java.sh launcher). Verified via `docker inspect` -- there is no
          # "server" subcommand/binary; an explicit args: ["server"] overrides CMD entirely and
          # fails with "exec: server: executable file not found".
          ports:
            - containerPort: 8181
              name: api
            - containerPort: 8182
              name: mgmt
          env:
            - name: POLARIS_PERSISTENCE_TYPE
              value: relational-jdbc
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: "jdbc:postgresql://polaris-pg-rw.lakehouse-catalog.svc:5432/polaris"
            # See the bootstrap Job's comment above: CNPG's secret keys don't match Quarkus's
            # expected env var names, so these need explicit secretKeyRef mapping, not envFrom.
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef: { name: polaris-pg-app, key: username }
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: polaris-pg-app, key: password }
            - name: POLARIS_REALM_CONTEXT_REALMS
              value: nimbus-lakehouse
            # MinIO -- reached via the hostAlias above (minio.nimbus.my) rather than the bare
            # IP, so the real Sectigo *.nimbus.my cert validates normally; no cert/hostname
            # bypass needed. Set as env vars (not a mounted config file -- see note above on why
            # that never worked): Quarkus/SmallRye Config maps any polaris.* property to an env
            # var by upper-casing and replacing non-alphanumerics with underscores.
            - name: POLARIS_STORAGE_S3_ENDPOINT
              value: "https://minio.nimbus.my:39090"
            - name: POLARIS_STORAGE_S3_PATH_STYLE_ACCESS
              value: "true"
          envFrom:
            # Polaris itself (not just its Spark/Flink clients) needs MinIO credentials --
            # confirmed via a server-side "SdkClientException: Unable to load credentials"
            # wrapped in a client-visible NotAuthorizedException on CREATE TABLE, since Polaris
            # touches S3 directly (e.g. validating the table's base location) even with
            # stsUnavailable: true skipping credential vending to clients.
            - secretRef:
                name: minio-credentials
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: polaris
  namespace: lakehouse-catalog
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: polaris
  ports:
    - name: api
      port: 8181
      targetPort: 8181
    - name: mgmt
      port: 8182
      targetPort: 8182
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: polaris
  namespace: lakehouse-catalog
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["polaris-delab.nimbus.my"]
      secretName: wildcard-nimbus-tls
  rules:
    - host: polaris-delab.nimbus.my
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: polaris
                port:
                  number: 8181
