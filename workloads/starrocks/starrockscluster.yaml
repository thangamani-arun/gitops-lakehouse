apiVersion: starrocks.com/v1
kind: StarRocksCluster
metadata:
  name: nimbus-lakehouse
  namespace: lakehouse-compute
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  starRocksFeSpec:
    replicas: 3
    image: starrocks/fe-ubuntu:4.1.4 # 4.1.5 requested but doesn't exist on Docker Hub; 4.1.4 is the latest 4.1.x tag
    # requests/limits are flat top-level fields on this CRD version, not nested under a
    # resourceRequirements object -- found via `kubectl explain`, which listed no such field
    # (the cluster was apparently created against an older CRD version that did support it).
    requests: { cpu: "4", memory: 8Gi }
    limits: { cpu: "4", memory: 8Gi }
    # Operator defaults (timeoutSeconds:1, periodSeconds:5, failureThreshold:3 = ~15s budget)
    # are too tight for this cluster's disk-latency instability: fe.log shows BDB-JE journal
    # replay routinely taking 4-16s per entry ("replay journal cost too much time"), which
    # blows the probe budget mid-catch-up and gets the container killed, restarting replay
    # from scratch -- a self-inflicted crash loop, not a StarRocks bug. Widened to a 180s
    # failure budget so replay can actually finish.
    livenessProbeFailureSeconds: 180
    readinessProbeFailureSeconds: 180
    startupProbeFailureSeconds: 180
    storageVolumes:
      - name: fe-meta
        storageClassName: ceph-block-ec
        storageSize: 20Gi
        mountPath: /opt/starrocks/fe/meta
    service:
      type: ClusterIP
  starRocksBeSpec:
    replicas: 3
    image: starrocks/be-ubuntu:4.1.4 # 4.1.5 requested but doesn't exist on Docker Hub; 4.1.4 is the latest 4.1.x tag
    requests: { cpu: "8", memory: 16Gi }
    limits: { cpu: "8", memory: 16Gi }
    storageVolumes:
      - name: be-storage
        storageClassName: ceph-block-ec
        storageSize: 100Gi
        mountPath: /opt/starrocks/be/storage
---
apiVersion: v1
kind: Service
metadata:
  name: starrocks-fe-http
  namespace: lakehouse-compute
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # app.starrocks.com/component was the wrong label key -- FE pods actually carry
  # app.kubernetes.io/component=fe (confirmed via `kubectl get pod --show-labels`), so this
  # Service had zero endpoints the whole time, silently blocking anything that used it
  # (starrocks-external-catalog-init's Job, the ingress). Also scoped to this StarRocksCluster
  # specifically via the ownerreference label -- the platform chart's own default
  # "kube-starrocks" release is also running in this namespace and shares the plain
  # component=fe label.
  selector:
    app.kubernetes.io/component: fe
    app.starrocks.ownerreference/name: nimbus-lakehouse-fe
  ports:
    - name: http
      port: 8030
      targetPort: 8030
    - name: mysql
      port: 9030
      targetPort: 9030
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: starrocks-fe
  namespace: lakehouse-compute
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["starrocks-delab.nimbus.my"]
      secretName: wildcard-nimbus-tls
  rules:
    - host: starrocks-delab.nimbus.my
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: starrocks-fe-http
                port:
                  number: 8030
