# Registers Polaris as an external Iceberg catalog inside StarRocks. This is SQL-level state
# (not a CRD), so it's applied via a Job against the FE's MySQL port once FE is up.
#
# KNOWN ISSUE (Day-0, unresolved): the catalog registers successfully (this Job succeeds,
# `SHOW CREATE CATALOG polaris_catalog` looks correct), but querying it
# (`SHOW DATABASES FROM polaris_catalog`, etc.) fails with the same intermittent
# "NotAuthorizedException: Not authorized" seen from Flink -- see workloads/flink-jobs/README.md
# for the full investigation. Confirmed via Polaris's access log: the failing
# GET /namespaces call lands on a Vert.x event-loop thread with no authenticated user, the
# same signature as Flink's failure, from a completely independent client codebase
# (StarRocks's own IcebergRESTCatalog, not Flink's). Reproducing on two unrelated clients with
# the identical symptom is strong evidence this is a genuine Polaris server-side bug, not
# something fixable via StarRocks/Flink client config -- Spark's REST client (a third,
# independent Iceberg client) does not trigger it and works reliably.
apiVersion: batch/v1
kind: Job
metadata:
  name: starrocks-external-catalog-init
  namespace: lakehouse-compute
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mysql:8.0
          envFrom:
            - secretRef: { name: minio-credentials } # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
            - secretRef: { name: polaris-catalog-credentials } # POLARIS_CLIENT_ID/SECRET
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until mysql -h starrocks-fe-http -P 9030 -u root -e "SELECT 1"; do
                echo "waiting for StarRocks FE..."; sleep 5
              done
              mysql -h starrocks-fe-http -P 9030 -u root <<SQL
              CREATE EXTERNAL CATALOG IF NOT EXISTS polaris_catalog
              PROPERTIES (
                "type" = "iceberg",
                "iceberg.catalog.type" = "rest",
                "iceberg.catalog.uri" = "http://polaris.lakehouse-catalog.svc:8181/api/catalog",
                "iceberg.catalog.warehouse" = "nimbus-lakehouse",
                "iceberg.catalog.security" = "oauth2",
                "iceberg.catalog.oauth2.credential" = "${POLARIS_CLIENT_ID}:${POLARIS_CLIENT_SECRET}",
                "iceberg.catalog.oauth2.scope" = "PRINCIPAL_ROLE:ALL",
                "iceberg.catalog.vended-credentials-enabled" = "false",
                "aws.s3.endpoint" = "https://s3api-dg.nimbus.my:39090",
                "aws.s3.enable_path_style_access" = "true",
                "aws.s3.enable_ssl" = "true",
                "aws.s3.region" = "us-east-1",
                "aws.s3.access_key" = "${AWS_ACCESS_KEY_ID}",
                "aws.s3.secret_key" = "${AWS_SECRET_ACCESS_KEY}"
              );
              SQL
