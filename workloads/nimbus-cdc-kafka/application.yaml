apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-nimbus-cdc-kafka
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/thangamani-arun/gitops-lakehouse.git
    targetRevision: main
    path: workloads/nimbus-cdc-kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: lakehouse-streaming
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
