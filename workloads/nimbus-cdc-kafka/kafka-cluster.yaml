# ~500KB/s CDC workload -> a small 3-node combined broker+controller (KRaft) cluster is
# comfortably right-sized. See infra/cnpg-clusters and platform/strimzi-operator for
# prerequisites (Postgres not needed here, but the Strimzi operator must be running first).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: lakehouse-streaming
  labels:
    strimzi.io/cluster: nimbus-cdc-kafka
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 20Gi
    class: ceph-block-ec
    deleteClaim: false
  resources:
    requests:
      cpu: 500m
      memory: 1536Mi
    limits:
      cpu: "1"
      memory: 2Gi
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: nimbus-cdc-kafka
  namespace: lakehouse-streaming
  annotations:
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
    argocd.argoproj.io/sync-wave: "1"
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    # No external listener: Debezium (KafkaConnect) and Flink both run in-cluster.
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      log.retention.hours: 72
  entityOperator:
    topicOperator: {}
    userOperator: {}
