# OpenMetadata's own bundled dependencies (OpenSearch for search index, MySQL for its metadata
# store, and OM's dedicated ingestion Airflow -- distinct from workloads/airflow, which is this
# lakehouse's orchestration Airflow, not OM's). We deliberately use the bundled MySQL/Airflow
# here rather than forcing everything onto CNPG Postgres: this is OpenMetadata's officially
# tested path and a first-pass shouldn't fight that for a component that's wired in last (wave 5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-openmetadata-dependencies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://helm.open-metadata.org
    chart: openmetadata-dependencies
    targetRevision: 2.0.2
    helm:
      releaseName: openmetadata-dependencies
      values: |
        opensearch:
          replicas: 3
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 2Gi }
        mysql:
          resources:
            requests: { cpu: 250m, memory: 512Mi }
          # Default startupProbe.timeoutSeconds: 1 is too tight for this cluster's disk I/O --
          # `mysqladmin ping` kept timing out mid-InnoDB-init, so kubelet killed the container
          # before it finished creating its redo logs, corrupting the data dir on every attempt
          # (confirmed via repeated "Cannot create redo log files because data files are
          # corrupt" on otherwise-fresh PVCs). Widened probe timing so a slow-but-alive mysqld
          # isn't killed mid-startup.
          primary:
            startupProbe:
              timeoutSeconds: 10
              periodSeconds: 15
              # 20*15=300s wasn't enough -- mysql-0 was still being killed mid-InnoDB-init under
              # this cluster's still-elevated disk latency (~200-280ms per op, see the plan's
              # root-cause writeup). Doubled to 600s of startup grace.
              failureThreshold: 40
            livenessProbe:
              timeoutSeconds: 10
            readinessProbe:
              timeoutSeconds: 10
        airflow:
          resources:
            requests: { cpu: 250m, memory: 512Mi }
          # logs.persistence defaults to a ReadWriteMany PVC (shared across scheduler/api-server/
          # triggerer). ceph-block-ec is RBD Filesystem-mode (RWO only) -- found via
          # ProvisioningFailed "multi node access modes are only supported on rbd block type
          # volumes". ceph-filesystem (CephFS) supports RWX natively.
          logs:
            persistence:
              storageClassName: ceph-filesystem
  destination:
    server: https://kubernetes.default.svc
    namespace: lakehouse-governance
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
