# openmetadata chart values. Verified against `helm show values open-metadata/openmetadata
# --version 2.0.2` after the first deploy attempt failed schema validation.
#
# Elasticsearch/pipelineServiceClientConfig are left at chart defaults: openmetadata-dependencies
# pins fullnameOverride: opensearch specifically so the chart's default (host: opensearch) works
# unmodified. Same for pipelineServiceClientConfig's default metadataApiEndpoint.
#
# Database is NOT left at chart defaults (host: mysql) -- pointed at the openmetadata-pg CNPG
# Postgres cluster (infra/cnpg-clusters/openmetadata-pg.yaml) instead. The bundled MySQL
# StatefulSet in openmetadata-dependencies repeatedly corrupted its InnoDB redo logs under this
# cluster's disk-latency instability ("Cannot create redo log files because data files are
# corrupt", every single fresh-PVC init attempt, not just a probe-timeout issue); CNPG/Postgres
# WAL is far more crash-resilient to the same failure mode, and CNPG was already
# deployed+healthy here from Day-0 but unused. openmetadata-dependencies' own bundled ingestion
# Airflow still uses the bundled MySQL for its own metadata (separate, smaller-blast-radius
# concern, not moved in this pass).
openmetadata:
  config:
    database:
      host: openmetadata-pg-rw.lakehouse-governance.svc
      port: 5432
      driverClass: org.postgresql.Driver
      dbScheme: postgresql
      databaseName: openmetadata
      auth:
        username: openmetadata
        password:
          secretRef: openmetadata-pg-app # CNPG-generated
          secretKey: password
      dbParams: ""

# Temporarily 1 (was 2): OpenMetadata's run-db-migrations initContainer has no leader-election/
# locking around schema migrations, so 2 replicas launching it simultaneously against a freshly
# initialized DB race each other and one fails permanently on a non-idempotent DDL statement
# ("relation already exists") -- confirmed via logs after switching to Postgres. Scale back to 2
# once the first replica has fully migrated and is Ready.
replicaCount: 1

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: openmetadata-delab.nimbus.my
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: wildcard-nimbus-tls
      hosts:
        - openmetadata-delab.nimbus.my

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { cpu: "2", memory: 2Gi }
