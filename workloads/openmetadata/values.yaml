# openmetadata chart values. Verified against `helm show values open-metadata/openmetadata
# --version 2.0.2` after the first deploy attempt failed schema validation.
#
# Database/elasticsearch/pipelineServiceClientConfig are deliberately left at chart defaults:
# openmetadata-dependencies (dependencies-application.yaml) pins fullnameOverride: mysql and
# fullnameOverride: opensearch specifically so the openmetadata chart's defaults (host: mysql,
# host: opensearch) work unmodified when both charts share the lakehouse-governance namespace —
# overriding them was wrong and caused a schema mismatch (string ports vs the chart's expected
# integers). Same for pipelineServiceClientConfig's default metadataApiEndpoint.
replicaCount: 2

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: openmetadata-delab.nimbus.my
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: wildcard-nimbus-tls
      hosts:
        - openmetadata-delab.nimbus.my

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { cpu: "2", memory: 2Gi }
