apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-openmetadata
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  sources:
    - repoURL: https://helm.open-metadata.org
      chart: openmetadata
      targetRevision: 2.0.2
      helm:
        releaseName: openmetadata
        valueFiles:
          - $values/workloads/openmetadata/values.yaml
    - repoURL: https://github.com/thangamani-arun/gitops-lakehouse.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/thangamani-arun/gitops-lakehouse.git
      targetRevision: main
      path: workloads/openmetadata/ingestion
  destination:
    server: https://kubernetes.default.svc
    namespace: lakehouse-governance
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
