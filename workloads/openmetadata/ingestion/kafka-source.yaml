apiVersion: v1
kind: ConfigMap
metadata:
  name: om-ingestion-kafka
  namespace: lakehouse-governance
data:
  workflow.yaml: |
    source:
      type: kafka
      serviceName: nimbus-cdc-kafka
      serviceConnection:
        config:
          type: Kafka
          bootstrapServers: nimbus-cdc-kafka-kafka-bootstrap.lakehouse-streaming.svc:9092
          schemaRegistryURL: ""
      sourceConfig:
        config:
          type: MessagingMetadata
    sink:
      type: metadata-rest
      config: {}
    workflowConfig:
      openMetadataServerConfig:
        hostPort: http://openmetadata.lakehouse-governance.svc:8585/api
        authProvider: openmetadata
        securityConfig:
          jwtToken: ${OM_BOT_TOKEN}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: om-ingestion-kafka
  namespace: lakehouse-governance
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingest
              image: docker.getcollate.io/openmetadata/ingestion:1.5.11
              command: ["metadata", "ingest", "-c", "/conf/workflow.yaml"]
              envFrom:
                - secretRef:
                    name: om-bot-token
              volumeMounts:
                - name: conf
                  mountPath: /conf
          volumes:
            - name: conf
              configMap:
                name: om-ingestion-kafka
