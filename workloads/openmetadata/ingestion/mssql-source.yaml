apiVersion: v1
kind: ConfigMap
metadata:
  name: om-ingestion-mssql
  namespace: lakehouse-governance
data:
  workflow.yaml: |
    source:
      type: mssql
      serviceName: retaildb-mssql
      serviceConnection:
        config:
          type: Mssql
          username: ${cdc_username}
          password: ${cdc_password}
          hostPort: 192.168.80.128:1433
          database: RetailDB
      sourceConfig:
        config:
          type: DatabaseMetadata
    sink:
      type: metadata-rest
      config: {}
    workflowConfig:
      openMetadataServerConfig:
        hostPort: http://openmetadata.lakehouse-governance.svc:8585/api
        authProvider: openmetadata
        securityConfig:
          jwtToken: ${OM_BOT_TOKEN}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: om-ingestion-mssql
  namespace: lakehouse-governance
spec:
  schedule: "0 * * * *" # hourly — low change rate source, cheap to run more than daily
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingest
              image: docker.getcollate.io/openmetadata/ingestion:1.5.11
              command: ["metadata", "ingest", "-c", "/conf/workflow.yaml"]
              envFrom:
                - secretRef:
                    name: mssql-credentials
                - secretRef:
                    name: om-bot-token
              volumeMounts:
                - name: conf
                  mountPath: /conf
          volumes:
            - name: conf
              configMap:
                name: om-ingestion-mssql
