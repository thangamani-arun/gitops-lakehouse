apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: sales-summary
  namespace: lakehouse-orchestration
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: Python
  mode: cluster
  image: apache/spark:3.5.3
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark-jobs/sales_summary.py
  sparkVersion: 3.5.3
  restartPolicy:
    type: Never
  deps:
    packages:
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1
      - org.apache.iceberg:iceberg-aws-bundle:1.6.1
  sparkConf:
    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.polaris: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.polaris.catalog-impl: org.apache.iceberg.rest.RESTCatalog
    spark.sql.catalog.polaris.uri: http://polaris.lakehouse-catalog.svc:8181/api/catalog
    spark.sql.catalog.polaris.warehouse: nimbus-lakehouse
    spark.sql.catalog.polaris.io-impl: org.apache.iceberg.aws.s3.S3FileIO
    spark.sql.catalog.polaris.s3.endpoint: https://192.168.80.128:39090
    spark.sql.catalog.polaris.s3.path-style-access: "true"
    # apache/spark image runs as a non-root UID with no real $HOME (/nonexistent), so Ivy's
    # --packages dependency resolution needs an explicit writable cache dir or spark-submit fails.
    spark.jars.ivy: /tmp/.ivy2
  driver:
    cores: 1
    memory: 2g
    serviceAccount: spark-jobs
    envFrom:
      - secretRef: { name: minio-credentials } # AWS_ACCESS_KEY_ID/SECRET_ACCESS_KEY -- S3FileIO's
        # default AWS SDK credential chain picks these up automatically, no sparkConf needed.
      - secretRef: { name: polaris-catalog-credentials } # POLARIS_CLIENT_ID/SECRET -- consumed by
        # the job script itself (see scripts/sales_summary.py), not sparkConf, to keep the
        # credential out of this git-committed CR.
    volumeMounts:
      - name: scripts
        mountPath: /opt/spark-jobs
  executor:
    cores: 1
    instances: 2
    memory: 2g
    envFrom:
      - secretRef: { name: minio-credentials }
      - secretRef: { name: polaris-catalog-credentials }
    volumeMounts:
      - name: scripts
        mountPath: /opt/spark-jobs
  volumes:
    - name: scripts
      configMap:
        name: spark-job-scripts
