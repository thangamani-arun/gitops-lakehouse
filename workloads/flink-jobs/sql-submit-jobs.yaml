# One-shot Jobs that submit sql/raw_ingest.sql and sql/silver_upsert.sql to their respective
# FlinkDeployment's SQL Gateway sidecar (see README.md). Sync-wave 3 so the gateway (wave 2,
# part of the FlinkDeployment) has had a chance to come up first -- sql-submit.py also retries
# against the gateway's /v1/info for up to 5 minutes on its own, so this is a soft ordering, not
# a hard requirement.
#
# KNOWN ISSUE (Day-0, unresolved): both Jobs currently fail on the first INSERT statement --
# Polaris intermittently returns 401 on a loadTable call the Iceberg REST client makes while
# resolving the INSERT's target table, even for a single non-concurrent statement. Confirmed via
# Polaris's access log that the failing requests land on a Vert.x event-loop thread while
# succeeding ones land on a worker executor-thread, from the same client connection -- points to
# a Polaris-side reactive-routing bug where its auth filter isn't applied consistently, not a
# Flink/Iceberg-client issue. Reproduced identically across iceberg-flink-runtime 1.6.1 and 1.10.2
# (latest), with and without EXECUTE STATEMENT SET, with and without persistent connections.
# Already confirmed on Polaris 1.7.0, the latest release as of Day-0 (no newer version to try).
# CREATE CATALOG/DATABASE/TABLE DDL all work fine against the same catalog from the same client --
# only the loadTable call made during INSERT resolution is affected. Left `suspend: true` so
# ArgoCD doesn't keep respawning a crash-looping pod; flip to false once this is root-caused
# (upstream Polaris fix, or a different REST client path) to resume RAW/SILVER ingestion.
apiVersion: batch/v1
kind: Job
metadata:
  name: flink-sql-submit-raw
  namespace: lakehouse-streaming
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  suspend: true
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: submit
          image: python:3.12-slim
          command: ["python3", "/scripts/sql-submit.py"]
          env:
            - name: GATEWAY_URL
              value: http://kafka-to-raw-sql-gateway.lakehouse-streaming.svc:8083
            - name: SQL_FILE
              value: /sql/raw_ingest.sql
          envFrom:
            - secretRef: { name: polaris-catalog-credentials }
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: sql
              mountPath: /sql
      volumes:
        - name: script
          configMap:
            name: flink-sql-submit-script
        - name: sql
          configMap:
            name: flink-sql-raw-ingest
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flink-sql-submit-silver
  namespace: lakehouse-streaming
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  suspend: true # see flink-sql-submit-raw's comment above -- same unresolved Day-0 known issue
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: submit
          image: python:3.12-slim
          command: ["python3", "/scripts/sql-submit.py"]
          env:
            - name: GATEWAY_URL
              value: http://raw-to-silver-sql-gateway.lakehouse-streaming.svc:8083
            - name: SQL_FILE
              value: /sql/silver_upsert.sql
            # changelog-pg-app is a CNPG secret in lakehouse-orchestration, not readable
            # cross-namespace -- changelog-pg-credentials is a copy of its username/password
            # keys, created out-of-band in this namespace (kubectl, not git, since it's a copy
            # of live credential material, not something to template/duplicate in a manifest).
            - name: CHANGELOG_PG_USERNAME
              valueFrom:
                secretKeyRef: { name: changelog-pg-credentials, key: username }
            - name: CHANGELOG_PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: changelog-pg-credentials, key: password }
          envFrom:
            - secretRef: { name: polaris-catalog-credentials }
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: sql
              mountPath: /sql
      volumes:
        - name: script
          configMap:
            name: flink-sql-submit-script
        - name: sql
          configMap:
            name: flink-sql-silver-upsert
