# The flink-kubernetes-operator chart (platform/flink-operator) grants this namespace's
# default job-runner permissions when lakehouse-streaming is in its watchNamespaces list.
# This SA is what FlinkDeployment pods run as.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: lakehouse-streaming
  annotations:
    argocd.argoproj.io/sync-wave: "2"
