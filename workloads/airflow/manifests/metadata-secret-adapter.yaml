# CNPG's "airflow-pg-app" secret already carries a ready-made `uri` key
# (postgresql://user:pass@host:port/db); the Airflow chart just wants that same string under
# a `connection` key. This Job is the adapter, so we don't have to hand-manage the password
# anywhere. Runs before the Helm-templated Airflow resources (sync-wave -1 vs their default 0)
# and must reach Complete before ArgoCD proceeds.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-metadata-secret-adapter
  namespace: lakehouse-orchestration
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-metadata-secret-adapter
  namespace: lakehouse-orchestration
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-metadata-secret-adapter
  namespace: lakehouse-orchestration
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
subjects:
  - kind: ServiceAccount
    name: airflow-metadata-secret-adapter
roleRef:
  kind: Role
  name: airflow-metadata-secret-adapter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-metadata-secret-adapter
  namespace: lakehouse-orchestration
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: airflow-metadata-secret-adapter
      restartPolicy: OnFailure
      containers:
        - name: adapter
          image: bitnami/kubectl:1.31
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              URI=$(kubectl get secret airflow-pg-app -n lakehouse-orchestration -o jsonpath='{.data.uri}' | base64 -d)
              kubectl create secret generic airflow-metadata-connection \
                -n lakehouse-orchestration \
                --from-literal=connection="${URI}" \
                --dry-run=client -o yaml | kubectl apply -f -
